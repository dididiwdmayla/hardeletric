<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Hard Eletric</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#080A0D" />
<link rel="icon" href="/uploads/590402669_17881333944423421_7223825427814460688_n.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --base-950:#080A0D; --base-800:#161C25; --base-700:#222A36;
    --azul-instrumento:#2B8CE8; --ambar-luz:#E9A23B;
    --branco:#F2F5F9; --cinza-texto:#8892A0;
    --ff-display:'Archivo',system-ui,sans-serif;
    --ff-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--base-950);color:var(--branco);
    font-family:var(--ff-display);line-height:1.6;
    display:flex;align-items:center;justify-content:center;padding:2rem;
    -webkit-font-smoothing:antialiased;
  }
  .caixa{max-width:44ch;text-align:left}
  .cod{
    font-family:var(--ff-mono);font-size:0.75rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--azul-instrumento);margin:0 0 1.25rem;
  }
  h1{
    font-size:clamp(2rem,5vw,3rem);line-height:1.06;letter-spacing:-0.015em;
    font-variation-settings:'wdth' 125;font-weight:700;margin:0 0 1rem;
  }
  h1 span{color:var(--ambar-luz)}
  p{color:var(--cinza-texto);margin:0 0 2rem}
  .links{display:flex;flex-wrap:wrap;gap:0.75rem}
  a{
    display:inline-block;padding:0.7rem 1.15rem;border:1px solid var(--base-700);
    border-radius:6px;background:var(--base-800);color:var(--branco);
    text-decoration:none;font-size:0.9rem;transition:border-color .15s,color .15s;
  }
  a:hover{border-color:var(--ambar-luz);color:var(--ambar-luz)}
  a.primario{background:var(--azul-instrumento);border-color:var(--azul-instrumento)}
  a.primario:hover{background:var(--ambar-luz);border-color:var(--ambar-luz);color:var(--base-950)}
  :focus-visible{outline:2px solid var(--azul-instrumento);outline-offset:3px}
</style>
</head>
<body>
  <main class="caixa">
    <p class="cod">Erro 404 · circuito aberto</p>
    <h1>Essa página não está<br /><span>no quadro.</span></h1>
    <p>O endereço que você abriu não existe ou foi movido. Volte para o início ou fale direto com a gente.</p>
    <div class="links">
      <a class="primario" href="/">Voltar ao início</a>
      <a href="/servicos">Serviços</a>
      <a href="/contato">Contato</a>
      <a href="https://wa.me/5544998137992">WhatsApp</a>
    </div>
  </main>
</body>
</html>
